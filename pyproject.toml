[project]
name = "retrieval-labs"
version = "0.1.0"
description = "Evidence-grounded contract review and retrieval benchmark on CUAD."
authors = [{ name = "Arthur Giribola", email = "arthurgiribola@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "numpy==2.5.3",
    "pydantic>=2.14.1",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Packages added from Phase 4 on use releases at least two weeks old (LOG-011). Transitive
# pins below keep new dependencies inside that rule; earlier phases' lock is unchanged.
constraint-dependencies = [
    "transformers==5.18.0",
    "certifi==2026.7.22",
    "cuda-bindings==13.4.3",
    "filelock==4.0.12",
    "narwhals==2.26.0",
    "setuptools==84.0.0",
    "tokenizers==0.23.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # prefer pathlib
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "data: requires the real CUAD dataset prepared under data/ (skipped when absent)",
]
